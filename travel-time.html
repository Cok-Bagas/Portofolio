<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
  <title>Travel Time Calculator — Tjokorda Oka</title>
</head>

<body class="bg-gray-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- NAVBAR SIMPEL -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">

      <a href="index.html" class="text-xl font-bold text-teal-700 tracking-tight">
        Tjokorda<span class="text-slate-400">.me</span>
      </a>

      <div class="flex flex-wrap justify-center gap-2">
        <a href="index.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Home
        </a>
        <a href="about.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          About
        </a>
        <a href="skills.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Skills
        </a>
        <a href="projects.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Projects
        </a>
        <a href="contact.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Contact
        </a>
      </div>

    </div>
  </nav>


  <!-- HERO / HEADER PAGE -->
  <section class="py-12 bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-6 text-center">

      <span class="text-xs font-semibold px-3 py-1 rounded-md bg-teal-50 text-teal-600 border border-teal-100 uppercase tracking-wider">
        JavaScript Task
      </span>

      <h1 class="mt-3 text-3xl font-extrabold text-slate-900">
        Travel Time Calculator
      </h1>

      <p class="mt-2 text-gray-600 text-sm max-w-md mx-auto">
        Hitung estimasi waktu tempuh perjalanan berdasarkan jarak dan kecepatan rata-rata.
      </p>

    </div>
  </section>


  <!-- CALCULATOR SECTION -->
  <section class="py-12">
    <div class="max-w-xl mx-auto px-6">

      <div class="bg-white p-6 sm:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">

        <!-- INPUT DISTANCE -->
        <div>
          <label for="distance" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
            Jarak Perjalanan (km)
          </label>
          <input 
            type="number" 
            id="distance" 
            placeholder="Contoh: 120" 
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-teal-500 focus:bg-white transition"
          >
        </div>

        <!-- INPUT SPEED -->
        <div>
          <label for="speed" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
            Kecepatan Rata-rata (km/jam)
          </label>
          <input 
            type="number" 
            id="speed" 
            placeholder="Contoh: 60" 
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-teal-500 focus:bg-white transition"
          >
        </div>

        <!-- BUTTON -->
        <button 
          onclick="calculateTime()" 
          class="w-full py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-medium text-sm transition shadow-sm"
        >
          Hitung Waktu Tempuh
        </button>

        <!-- RESULT DISPLAY -->
        <div id="resultBox" class="hidden mt-6 p-4 rounded-xl bg-teal-50 border border-teal-100 text-center">
          <p class="text-xs font-semibold text-teal-700 uppercase tracking-wider mb-1">Estimasi Waktu Tempuh</p>
          <p id="resultText" class="text-xl font-bold text-slate-900">-</p>
        </div>

      </div>

    </div>
  </section>


  <!-- FOOTER -->
  <footer class="py-6 bg-white border-t border-gray-200 text-center text-sm text-gray-500">
    © 2026 Tjokorda Oka — All rights reserved.
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    function calculateTime() {
      const distance = parseFloat(document.getElementById('distance').value);
      const speed = parseFloat(document.getElementById('speed').value);
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');

      if (isNaN(distance) || isNaN(speed) || distance <= 0 || speed <= 0) {
        resultBox.classList.remove('hidden');
        resultText.textContent = "Mohon masukkan angka jarak dan kecepatan yang valid!";
        resultText.className = "text-sm font-semibold text-red-600";
        return;
      }

      const totalHours = distance / speed;
      const hours = Math.floor(totalHours);
      const minutes = Math.round((totalHours - hours) * 60);

      let output = "";
      if (hours > 0) output += hours + " jam ";
      if (minutes > 0) output += minutes + " menit";
      if (hours === 0 && minutes === 0) output = "Kurang dari 1 menit";

      resultBox.classList.remove('hidden');
      resultText.textContent = output;
      resultText.className = "text-xl font-bold text-slate-900";
    }
  </script>

</body>

</html>
