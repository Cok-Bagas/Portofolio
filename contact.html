<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
  <title>Contact — Tjokorda Oka</title>
</head>

<body class="bg-gray-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- NAVBAR SIMPEL -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">

      <a href="index.html" class="text-xl font-bold text-teal-700 tracking-tight">
        My<span class="text-slate-400">Portofolio</span>
      </a>

      <div class="flex flex-wrap justify-center gap-2">
        <a href="index.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Home
        </a>
        <a href="about.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          About
        </a>
        <a href="skills.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Skills
        </a>
        <a href="projects.html" class="px-4 py-1.5 rounded-full text-gray-600 hover:text-teal-600 text-sm transition">
          Projects
        </a>
        <a href="contact.html" class="px-4 py-1.5 rounded-full bg-teal-50 text-teal-700 font-semibold text-sm">
          Contact
        </a>
      </div>

    </div>
  </nav>


  <!-- HERO / HEADER PAGE -->
  <section class="py-12 bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-6 text-center">

      <span class="text-xs font-semibold px-3 py-1 rounded-md bg-teal-50 text-teal-600 border border-teal-100 uppercase tracking-wider">
        Get In Touch
      </span>

      <h1 class="mt-3 text-3xl font-extrabold text-slate-900">
        Contact Me
      </h1>

      <p class="mt-2 text-gray-600 text-sm max-w-md mx-auto">
        Silakan hubungi saya untuk pertanyaan, diskusi proyek, atau sekadar menyapa.
      </p>

    </div>
  </section>


  <!-- CONTACT SECTION -->
  <section class="py-12">
    <div class="max-w-4xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- INFO CONTACT (SISI KIRI) -->
      <div class="space-y-4">

        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex items-center gap-4">
          <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center font-bold shrink-0">
            ✉️
          </div>
          <div>
            <h3 class="text-xs text-gray-500 font-medium">Email</h3>
            <p class="text-sm font-bold text-slate-900">tjokorda@example.com</p>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex items-center gap-4">
          <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center font-bold shrink-0">
            📍
          </div>
          <div>
            <h3 class="text-xs text-gray-500 font-medium">Lokasi</h3>
            <p class="text-sm font-bold text-slate-900">Indonesia</p>
          </div>
        </div>

      </div>


      <!-- FORM CONTACT (SISI KANAN / WIDE) -->
      <div class="md:col-span-2 bg-white p-6 sm:p-8 rounded-2xl border border-gray-200 shadow-sm">

        <form action="#" method="POST" class="space-y-5">
          <div>
            <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
              Nama
            </label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              placeholder="Masukkan nama Anda"
              class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-teal-500 focus:bg-white transition"
              required
            >
          </div>

          <div>
            <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
              Email
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="nama@email.com"
              class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-teal-500 focus:bg-white transition"
              required
            >
          </div>

          <div>
            <label for="message" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
              Pesan
            </label>
            <textarea 
              id="message" 
              name="message" 
              rows="4" 
              placeholder="Tulis pesan Anda di sini..."
              class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-teal-500 focus:bg-white transition resize-none"
              required
            ></textarea>
          </div>

          <button 
            type="submit"
            class="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-medium text-sm transition"
          >
            Kirim Pesan
          </button>
        </form>

      </div>

    </div>
  </section>


  <!-- FOOTER -->
  <footer class="py-6 bg-white border-t border-gray-200 text-center text-sm text-gray-500">
    © 2026 Tjokorda Oka Dalem Bagaskara — All rights reserved.
  </footer>

</body>

</html>
